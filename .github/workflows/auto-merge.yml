name: Auto Merge

on:
  workflow_run:
    workflows: ["Pull Request Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository != null &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Find matching open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pull_requests="$(
            gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls"
          )"

          pr_number="$(
            jq -r \
              --arg head_sha "$HEAD_SHA" \
              --arg head_branch "$HEAD_BRANCH" \
              --arg repository "$REPOSITORY" \
              '[.[] | select(
                .base.ref == "develop" and
                .state == "open" and
                .draft == false and
                .head.sha == $head_sha and
                .head.ref == $head_branch and
                .head.repo.full_name == $repository
              )][0].number // empty' \
              <<< "$pull_requests"
          )"

          if [ -z "$pr_number" ]; then
            echo "No matching, ready-to-merge pull request found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Squash merge pull request
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
